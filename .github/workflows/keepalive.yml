name: keepalive
# GitHub disables scheduled workflows after 60 days with no repo activity.
# Once a month this commits a date stamp (no IPs, no names) and re-enables
# the uptime workflow, so the outside check never goes quiet on its own.
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Commit date stamp
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > keepalive.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add keepalive.txt
          git commit -m "keepalive $(date -u +%Y-%m-%d)"
          git push
      - name: Make sure the uptime workflow is enabled
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/uptime.yml/enable"
          echo "uptime.yml enabled"
